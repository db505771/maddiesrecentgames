<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Maddie's Roblox Wrapped</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#000;

    color:white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        system-ui,
        sans-serif;
}

body{
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(100,100,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(255,80,180,.13),
            transparent 35%
        ),
        #000;
}

#app{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
}


/* =========================
   LOADING
========================= */

#loading{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:#000;

    z-index:100;
}

.loadingInner{
    padding:30px;
}

.spinner{
    width:28px;
    height:28px;

    margin:0 auto 18px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.15);
    border-top-color:white;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loadingTitle{
    font-size:20px;
    font-weight:700;
}

.loadingSubtitle{
    margin-top:7px;

    font-size:14px;

    color:rgba(255,255,255,.48);
}


/* =========================
   ERROR
========================= */

#error{
    display:none;

    position:absolute;
    inset:0;

    z-index:200;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    background:#000;
}

.errorTitle{
    font-size:22px;
    font-weight:700;
}

.errorText{
    margin-top:10px;

    line-height:1.5;

    color:rgba(255,255,255,.5);
}

.retry{
    margin-top:22px;

    border:0;

    padding:12px 21px;

    border-radius:18px;

    background:white;
    color:black;

    font-size:15px;
    font-weight:650;
    cursor:pointer;
}


/* =========================
   SLIDES
========================= */

#slides{
    width:100%;
    height:100%;

    display:flex;

    transition:
        transform .45s cubic-bezier(.22,.8,.2,1);

    will-change:transform;
}

.slide{
    min-width:100%;
    height:100%;

    padding:
        35px
        22px
        70px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;
}

.content{
    width:min(100%,520px);
    max-height:100%;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.center{
    text-align:center;
}


/* =========================
   TEXT
========================= */

.eyebrow{
    margin-bottom:12px;

    font-size:14px;
    font-weight:650;

    letter-spacing:.5px;

    color:rgba(255,255,255,.45);
}

.title{
    margin:0;

    font-size:
        clamp(38px,11vw,70px);

    line-height:.96;

    letter-spacing:-3px;

    font-weight:760;
}

.subtitle{
    margin-top:18px;

    font-size:17px;

    line-height:1.45;

    color:rgba(255,255,255,.55);
}

.bigNumber{
    margin:8px 0;

    font-size:
        clamp(70px,22vw,145px);

    line-height:.85;

    letter-spacing:-6px;

    font-weight:780;
}

.bigUnit{
    font-size:21px;

    font-weight:600;

    color:rgba(255,255,255,.48);
}


/* =========================
   GLASS
========================= */

.glass{
    background:
        rgba(255,255,255,.075);

    border:
        1px solid rgba(255,255,255,.11);

    box-shadow:
        0 20px 70px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter:
        blur(28px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(130%);

    border-radius:30px;
}


/* =========================
   STAT CARD
========================= */

.statCard{
    padding:25px;

    margin-top:24px;
}

.statLabel{
    font-size:13px;

    text-transform:uppercase;

    letter-spacing:.7px;

    color:rgba(255,255,255,.42);
}

.statValue{
    margin-top:8px;

    font-size:34px;

    font-weight:720;

    letter-spacing:-1px;
}

.statSmall{
    margin-top:5px;

    font-size:14px;

    color:rgba(255,255,255,.45);
}


/* =========================
   GAME CARDS
========================= */

.gameCard{
    display:flex;

    align-items:center;

    gap:15px;

    padding:15px;

    margin-top:11px;
}

.gameIcon{
    width:58px;
    height:58px;

    flex-shrink:0;

    border-radius:16px;

    object-fit:cover;

    background:
        rgba(255,255,255,.08);
}

.gameInfo{
    min-width:0;
    flex:1;
}

.gameName{
    font-size:17px;

    font-weight:650;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.gameTime{
    margin-top:4px;

    font-size:14px;

    color:rgba(255,255,255,.47);
}

.rank{
    width:25px;

    font-size:21px;

    font-weight:750;

    color:rgba(255,255,255,.38);
}


/* =========================
   MONTH CHART
========================= */

.monthList{
    margin-top:22px;
}

.monthRow{
    display:grid;

    grid-template-columns:
        42px
        1fr
        55px;

    gap:10px;

    align-items:center;

    margin:10px 0;
}

.monthName{
    font-size:12px;

    color:rgba(255,255,255,.5);
}

.bar{
    height:7px;

    overflow:hidden;

    border-radius:10px;

    background:
        rgba(255,255,255,.09);
}

.barFill{
    height:100%;

    border-radius:inherit;

    background:
        rgba(255,255,255,.72);
}

.monthValue{
    text-align:right;

    font-size:12px;

    color:rgba(255,255,255,.5);
}


/* =========================
   RECAP
========================= */

.recapGrid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:11px;

    margin-top:25px;
}

.recapCard{
    min-height:105px;

    padding:20px;
}

.recapLabel{
    font-size:12px;

    color:rgba(255,255,255,.42);
}

.recapValue{
    margin-top:7px;

    font-size:24px;

    font-weight:700;
}


/* =========================
   DOTS
========================= */

.dots{
    position:absolute;

    bottom:27px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:5px;

    z-index:20;
}

.dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:
        rgba(255,255,255,.22);

    transition:
        all .25s ease;
}

.dot.active{
    width:18px;

    border-radius:5px;

    background:
        rgba(255,255,255,.8);
}


/* =========================
   TAP ZONES
========================= */

.tapZone{
    position:fixed;

    top:0;
    bottom:0;

    width:25%;

    z-index:10;
}

.tapLeft{
    left:0;
}

.tapRight{
    right:0;
}


/* =========================
   SMALL SCREENS
========================= */

@media(max-height:650px){

    .slide{
        padding-top:20px;
        padding-bottom:55px;
    }

    .bigNumber{
        font-size:75px;
    }

    .statCard{
        padding:18px;

        margin-top:15px;
    }

    .gameIcon{
        width:48px;
        height:48px;
    }

}

</style>

</head>


<body>

<div id="app">


    <div id="loading">

        <div class="loadingInner">

            <div class="spinner"></div>

            <div class="loadingTitle">
                Making Maddie's Wrapped
            </div>

            <div class="loadingSubtitle">
                Loading real Roblox data...
            </div>

        </div>

    </div>


    <div id="error">

        <div>

            <div class="errorTitle">
                Couldn't load the data
            </div>

            <div
                class="errorText"
                id="errorText"
            ></div>

            <button
                class="retry"
                onclick="start()"
            >
                Try Again
            </button>

        </div>

    </div>


    <div id="slides"></div>


    <div
        class="tapZone tapLeft"
        onclick="previousSlide()"
    ></div>

    <div
        class="tapZone tapRight"
        onclick="nextSlide()"
    ></div>


    <div
        class="dots"
        id="dots"
    ></div>


</div>


<script>

/* =========================================================
   API
========================================================= */

/* Use /exec endpoint instead of /dev for deployed web apps */
const API =
"https://script.google.com/macros/s/AKfycbzERZpBwUfHcZ6gDl5ion7a-7W0U6JpTkdYKR0m7RHq/exec";

const YEAR = 2026;


/* =========================================================
   HELPERS
========================================================= */

function formatMinutes(minutes){

    minutes =
        Math.max(
            0,
            Math.round(Number(minutes) || 0)
        );

    const hours =
        Math.floor(minutes / 60);

    const mins =
        minutes % 60;

    if(hours === 0){
        return `${mins}m`;
    }

    if(mins === 0){
        return `${hours}h`;
    }

    return `${hours}h ${mins}m`;
}


function formatHours(minutes){

    minutes =
        Math.max(
            0,
            Number(minutes) || 0
        );

    return (minutes / 60).toFixed(1);
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function monthName(month){

    return new Date(
        YEAR,
        month,
        1
    ).toLocaleString(
        "en-US",
        {
            month:"long"
        }
    );
}


function parseDate(value){

    if(!value){
        return null;
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return null;
    }

    return date;
}


/* =========================================================
   LOAD API
========================================================= */

async function loadGames(){

    const response =
        await fetch(
            API + "?_=" + Date.now(),
            {
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "API returned " +
            response.status
        );
    }

    const data =
        await response.json();

    if(!Array.isArray(data)){

        throw new Error(
            "Game API did not return an array."
        );
    }

    return data
        .map(game => {

            return {

                id:
                    String(
                        game.id ?? ""
                    ).trim(),

                name:
                    String(
                        game.name ??
                        "Unknown Game"
                    ).trim(),

                minutes:
                    Number(
                        game.minutes
                    ) || 0,

                image:
                    String(
                        game.image ?? ""
                    ).trim(),

                date:
                    parseDate(
                        game.date
                    )

            };

        })
        .filter(game => {

            return (
                game.date &&
                game.date.getFullYear() === YEAR &&
                game.minutes > 0
            );

        });

}


/* =========================================================
   GROUP DAILY DATA
========================================================= */

function buildDays(games){

    const map =
        new Map();

    games.forEach(game => {

        const d =
            game.date;

        const key =
            d.getFullYear() +
            "-" +
            String(
                d.getMonth() + 1
            ).padStart(2,"0") +
            "-" +
            String(
                d.getDate()
            ).padStart(2,"0");


        if(!map.has(key)){

            map.set(
                key,
                {
                    date:
                        new Date(
                            d.getFullYear(),
                            d.getMonth(),
                            d.getDate()
                        ),

                    minutes:0
                }
            );

        }


        map.get(key).minutes +=
            game.minutes;

    });


    return Array.from(
        map.values()
    ).sort(
        (a,b) =>
            a.date - b.date
    );

}


/* =========================================================
   MONTH TOTALS
========================================================= */

function buildMonths(days){

    const months =
        Array(12).fill(0);

    days.forEach(day => {

        months[
            day.date.getMonth()
        ] += day.minutes;

    });

    return months;

}


/* =========================================================
   TOP MONTH
========================================================= */

function topMonth(months){

    let best =
        0;

    for(
        let i = 1;
        i < months.length;
        i++
    ){

        if(
            months[i] >
            months[best]
        ){

            best = i;

        }

    }

    return {

        month:best,

        minutes:
            months[best]

    };

}


/* =========================================================
   WEEK
========================================================= */

function getWeekStart(date){

    const d =
        new Date(date);

    d.setHours(
        0,0,0,0
    );

    d.setDate(
        d.getDate() -
        d.getDay()
    );

    return d;

}


function topWeek(days){

    const weeks =
        new Map();


    days.forEach(day => {

        if(day.minutes <= 0){
            return;
        }


        const start =
            getWeekStart(
                day.date
            );


        const key =
            start.toISOString()
                .slice(0,10);


        if(!weeks.has(key)){

            weeks.set(
                key,
                {
                    start,
                    minutes:0
                }
            );

        }


        weeks.get(key).minutes +=
            day.minutes;

    });


    let best = null;


    weeks.forEach(week => {

        if(
            !best ||
            week.minutes >
            best.minutes
        ){

            best = week;

        }

    });


    return best || {

        start:
            new Date(
                YEAR,
                0,
                1
            ),

        minutes:0

    };

}


/* =========================================================
   TOP DAY
========================================================= */

function topDay(days){

    let best = null;


    days.forEach(day => {

        if(
            !best ||
            day.minutes >
            best.minutes
        ){

            best = day;

        }

    });


    return best || {

        date:
            new Date(
                YEAR,
                0,
                1
            ),

        minutes:0

    };

}


/* =========================================================
   STREAK
========================================================= */

function longestStreak(days){

    if(!days.length){
        return 0;
    }


    let longest = 1;

    let current = 1;


    for(
        let i = 1;
        i < days.length;
        i++
    ){

        const previous =
            days[i - 1].date;

        const currentDate =
            days[i].date;


        const difference =
            Math.round(
                (
                    currentDate -
                    previous
                ) / 86400000
            );


        if(
            difference === 1
        ){

            current++;

            longest =
                Math.max(
                    longest,
                    current
                );

        }else{

            current = 1;

        }

    }


    return longest;

}


/* =========================================================
   MERGE GAMES
========================================================= */

function mergeGames(games){

    const map =
        new Map();


    games.forEach(game => {

        const id =
            game.id ||
            game.name;


        if(!map.has(id)){

            map.set(
                id,
                {
                    id,
                    name:game.name,
                    image:game.image,
                    minutes:0
                }
            );

        }


        const existing =
            map.get(id);


        existing.minutes +=
            game.minutes;


        if(
            !existing.image &&
            game.image
        ){

            existing.image =
                game.image;

        }


        if(
            game.name &&
            game.name.length >
            existing.name.length
        ){

            existing.name =
                game.name;

        }

    });


    return Array.from(
        map.values()
    ).sort(
        (a,b) =>
            b.minutes -
            a.minutes
    );

}


/* =========================================================
   LONGEST SESSION
========================================================= */

function longestSession(games){

    let best = null;


    games.forEach(game => {

        if(
            !best ||
            game.minutes >
            best.minutes
        ){

            best = game;

        }

    });


    return best;

}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(date){

    return date.toLocaleDateString(
        "en-US",
        {
            month:"long",
            day:"numeric",
            year:"numeric"
        }
    );

}


function formatShortDate(date){

    return date.toLocaleDateString(
        "en-US",
        {
            month:"short",
            day:"numeric"
        }
    );

}


function formatWeek(start){

    const end =
        new Date(start);

    end.setDate(
        end.getDate() + 6
    );


    return (
        formatShortDate(start) +
        " – " +
        formatShortDate(end)
    );

}


/* =========================================================
   GAME CARD
========================================================= */

function gameCard(
    game,
    rank = null
){

    return `

        <div class="gameCard glass">

            ${
                rank
                ?
                `
                <div class="rank">
                    ${rank}
                </div>
                `
                :
                ""
            }

            ${
                game.image
                ?
                `
                <img
                    class="gameIcon"
                    src="${escapeHTML(game.image)}"
                    alt=""
                >
                `
                :
                `
                <div class="gameIcon"></div>
                `
            }

            <div class="gameInfo">

                <div class="gameName">

                    ${escapeHTML(
                        game.name
                    )}

                </div>

                <div class="gameTime">

                    ${formatMinutes(
                        game.minutes
                    )}

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   BUILD WRAPPED
========================================================= */

function buildWrapped(
    stats
){

    const slides = [];


    /* =========================
       1. INTRO
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content center">

                <div class="eyebrow">
                    MADDIE'S 2026
                </div>

                <h1 class="title">
                    Roblox<br>
                    Wrapped.
                </h1>

                <div class="subtitle">
                    Your year on Roblox,<br>
                    all in one place.
                </div>

            </div>

        </section>

    `);


    /* =========================
       2. TOTAL TIME
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content">

                <div class="eyebrow">
                    YOUR YEAR
                </div>

                <div class="bigNumber">

                    ${formatHours(
                        stats.totalMinutes
                    )}

                </div>

                <div class="bigUnit">
                    hours played
                </div>


                <div class="statCard glass">

                    <div class="statLabel">
                        That's
                    </div>

                    <div class="statValue">

                        ${Math.round(
                            stats.totalMinutes
                        ).toLocaleString()}

                        minutes

                    </div>

                    <div class="statSmall">

                        across
                        ${stats.activeDays}
                        active days

                    </div>

                </div>

            </div>

        </section>

    `);


    /* =========================
       3. TOP MONTH
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content">

                <div class="eyebrow">
                    YOUR TOP MONTH
                </div>

                <h1 class="title">

                    ${monthName(
                        stats.topMonth.month
                    )}

                </h1>

                <div class="subtitle">
                    Your biggest month of Roblox.
                </div>


                <div class="statCard glass">

                    <div class="statLabel">
                        Playtime
                    </div>

                    <div class="statValue">

                        ${formatMinutes(
                            stats.topMonth.minutes
                        )}

                    </div>

                </div>

            </div>

        </section>

    `);


    /* =========================
       4. TOP WEEK
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content">

                <div class="eyebrow">
                    YOUR TOP WEEK
                </div>

                <h1 class="title">

                    ${formatWeek(
                        stats.topWeek.start
                    )}

                </h1>

                <div class="subtitle">
                    Your most active Sunday–Saturday week.
                </div>


                <div class="statCard glass">

                    <div class="statLabel">
                        Playtime
                    </div>

                    <div class="statValue">

                        ${formatMinutes(
                            stats.topWeek.minutes
                        )}

                    </div>

                </div>

            </div>

        </section>

    `);


    /* =========================
       5. TOP DAY
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content">

                <div class="eyebrow">
                    YOUR TOP DAY
                </div>

                <h1 class="title">

                    ${formatDate(
                        stats.topDay.date
                    )}

                </h1>

                <div class="subtitle">
                    Your biggest Roblox day of the year.
                </div>


                <div class="statCard glass">

                    <div class="statLabel">
                        Playtime
                    </div>

                    <div class="statValue">

                        ${formatMinutes(
                            stats.topDay.minutes
                        )}

                    </div>

                </div>

            </div>

        </section>

    `);


    /* =========================
       6. #1 GAME
    ========================= */

    if(stats.games.length){

        const game =
            stats.games[0];


        slides.push(`

            <section class="slide">

                <div class="content">

                    <div class="eyebrow">
                        YOUR #1 GAME
                    </div>

                    ${gameCard(game)}


                    <div class="statCard glass">

                        <div class="statLabel">
                            Time played
                        </div>

                        <div class="statValue">

                            ${formatMinutes(
                                game.minutes
                            )}

                        </div>

                    </div>

                </div>

            </section>

        `);

    }


    /* =========================
       7. TOP 3
    ========================= */

    if(stats.games.length){

        slides.push(`

            <section class="slide">

                <div class="content">

                    <div class="eyebrow">
                        YOUR TOP 3
                    </div>

                    ${
                        stats.games
                            .slice(0,3)
                            .map(
                                (game,index) =>
                                    gameCard(
                                        game,
                                        index + 1
                                    )
                            )
                            .join("")
                    }

                </div>

            </section>

        `);

    }


    /* =========================
       8. LEAST PLAYED
    ========================= */

    if(stats.games.length){

        const least =
            stats.games[
                stats.games.length - 1
            ];


        slides.push(`

            <section class="slide">

                <div class="content">

                    <div class="eyebrow">
                        YOUR LEAST PLAYED GAME
                    </div>

                    ${gameCard(least)}

                    <div class="subtitle">

                        ${formatMinutes(
                            least.minutes
                        )}

                        of playtime.

                    </div>

                </div>

            </section>

    slides.push(`

    /* =========================

    ========================= */

    slides.push(`

        <section class="slide">

                <div class="eyebrow">
                    GAMING STREAK
                </div>

                <div class="bigNumber">

                    ${stats.longestStreak}

                </div>

    /* =========================

    ========================= */

    slides.push(`

        <section class="slide">

                </div>

        </section>

    `);


    /* =========================
       13. MONTH BY MONTH
    ========================= */

    const maxMonth =
        Math.max(
            ...stats.months,
            1
        );


    slides.push(`

        <section class="slide">

            <div class="content">

                <div class="eyebrow">
                    MONTH BY MONTH
                </div>

                <h1 class="title">
                    Your year.
                </h1>


                <div class="monthList">

                    ${
                        stats.months
                            .map(
                                (minutes,index) => {

                                    const width =
                                        (
                                            minutes /
                                            maxMonth
                                        ) * 100;


                                    return `

                                        <div class="monthRow">

                                            <div class="monthName">

                                                    index

    /* =========================
       14. RECAP
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content">

                <h1 class="title">

                        <div class="recapLabel">

                        <div class="recapValue">

                                stats.totalMinutes
                            )}

                        </div>

                    </div>


                    <div class="recapCard glass">

                        <div class="recapLabel">
                            ACTIVE DAYS
                        </div>

                        <div class="recapValue">

                    <div class="recapCard glass">

                        <div class="recapLabel">
                            GAMES
                        </div>

                    <div class="recapCard glass">

                        </div>

                    </div>

        </section>

    /* =========================
       15. FINAL
    ========================= */

    slides.push(`

        <section class="slide">

            <div class="content center">

                <div class="eyebrow">
                    MADDIE'S 2026
                </div>

                <h1 class="title">

                    That's<br>
                    a wrap.

                </h1>

                <div class="subtitle">

                    ${formatHours(
                        stats.totalMinutes
                    )}
                    hours.<br>

                    ${stats.games.length}
                    games.<br>

                    One year of Roblox.

                </div>

            </div>

        </section>

    `);


    document.getElementById(
        "slides"
    ).innerHTML =
        slides.join("");


    createDots(
        slides.length
    );


    currentSlide = 0;

    updateSlide();

}


/* =========================================================
   NAVIGATION
========================================================= */

let currentSlide = 0;

let slideCount = 0;


function createDots(count){

    slideCount =
        count;


    document.getElementById(
        "dots"
    ).innerHTML =

        Array.from(
            {length:count},
            (_,index) => `

                <div
                    class="dot ${
                        index === 0
                        ? "active"
                        : ""
                    }"
                ></div>

            `
        ).join("");

}


function updateSlide(){

    document.getElementById(
        "slides"
    ).style.transform =

        `translateX(-${
            currentSlide * 100
        }%)`;


    document
        .querySelectorAll(".dot")
        .forEach(
            (dot,index) => {

                dot.classList.toggle(
                    "active",
                    index === currentSlide
                );

            }
        );

}


function nextSlide(){

    if(
        currentSlide >=
        slideCount - 1
    ){
        return;
    }


    currentSlide++;

    updateSlide();

}


function previousSlide(){

    if(
        currentSlide <= 0
    ){
        return;
    }


    currentSlide--;

    updateSlide();

}


/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.touches[0].clientX;

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive:true
    }
);


document.addEventListener(
    "touchend",
    event => {

        const endX =
            event.changedTouches[0].clientX;

        const endY =
            event.changedTouches[0].clientY;


        const dx =
            endX -
            touchStartX;

        const dy =
            endY -
            touchStartY;


        if(
            Math.abs(dx) > 50 &&
            Math.abs(dx) >
            Math.abs(dy)
        ){

            if(dx < 0){

                nextSlide();

            }else{

                previousSlide();

            }

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "ArrowRight"
        ){
            nextSlide();
        }

        if(
            event.key ===
            "ArrowLeft"
        ){
            previousSlide();
        }

    }
);


/* =========================================================
   START
========================================================= */

async function start(){

    document.getElementById(
        "loading"
    ).style.display =
        "flex";


    document.getElementById(
        "error"
    ).style.display =
        "none";


    try{

        const games =
            await loadGames();


        if(!games.length){

            throw new Error(
                "No 2026 game data was returned."
            );

        }


        const days =
            buildDays(
                games
            );


        const totalMinutes =
            games.reduce(
                (total,game) =>
                    total +
                    game.minutes,
                0
            );


        const activeDays =
            days.length;


        const averageDay =
            activeDays > 0
            ?
            totalMinutes /
            activeDays
            :
            0;


        const months =
            buildMonths(
                days
            );


        const stats = {

            totalMinutes,

            activeDays,

            averageDay,

            months,

            games:
                mergeGames(
                    games
                ),

            topMonth:
                topMonth(
                    months
                ),

            topWeek:
                topWeek(
                    days
                ),

            topDay:
                topDay(
                    days
                ),

            longestStreak:
                longestStreak(
                    days
                ),

            longestSession:
                longestSession(
                    games
                )

        };


        buildWrapped(
            stats
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


    }catch(error){

        console.error(
            "Wrapped error:",
            error
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "error"
        ).style.display =
            "flex";


        document.getElementById(
            "errorText"
        ).textContent =
            "The Roblox game API couldn't be loaded. " +
            "Make sure your Apps Script project is published as a Web App with access set to 'Anyone'.";

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

start();

</script>
